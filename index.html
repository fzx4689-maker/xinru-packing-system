  <div class="top">
    <div class="title">欣儒農產行｜包裝即時系統</div>

      <button class="tab" data-tab="today">訂單查詢</button>
    </div>
  </div>

  <div class="wrap">
    <section id="stall" class="panel active">
      <div class="card">
        <h2>攤位下單</h2>

        <div class="urgentRow">

        </div>

        <div class="grid2">
          <div class="field"><label class="label">客戶／店家名稱</label><input id="customer" class="input" autocomplete="off"></div>
          <div class="field"><label class="label">訂單日期</label><input id="orderDate" class="input" type="date"></div>
          <div class="field"><label class="label">取貨時間</label><input id="pickupTime" class="input" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" autocomplete="off"></div>
        </div>

        <div class="field">
          <label class="label">需求內容（每行一項）</label>
          <textarea id="items" class="textarea" placeholder=""></textarea>
        </div>

        <div class="field">
          <label class="label">📷 拍照下單</label>
          <div class="photoBox">
            <img id="photoPreview" alt="訂單照片">
            <input id="photoInput" class="file" type="file" accept="image/*" capture="environment">
            <div class="actions" style="justify-content:center">
              <button id="takePhoto" class="btn gray">拍照／選照片</button>
              <button id="ocrPhoto" class="btn blue">辨識照片文字</button>
              <button id="clearPhoto" class="btn gray">移除照片</button>
            </div>
            <div id="ocrStatus" class="helper" style="margin:10px 0 0">拍照後可辨識文字，辨識結果會放到需求內容，可再人工修改後送出。</div>
          </div>
        </div>

        <div class="field"><label class="label">備註</label><input id="note" class="input" placeholder=""></div>

        <div class="actions" style="margin-top:14px"><button id="submitOrder" class="btn primary" style="flex:1">送出訂單</button></div>
      </div>

      <div class="card"><h2 style="font-size:19px">音譯測試</h2><div class="helper">輸入中文菜名，先看泰文字音譯。</div><div class="actions"><input id="transInput" class="input" style="flex:1" placeholder="例如：白蘿蔔"><button id="transBtn" class="btn blue">測試</button></div><div id="transResult" style="margin-top:12px;font-weight:800"></div></div>
      <div class="card"><h2 style="font-size:19px">目前訂單</h2><div id="stallOrders"></div></div>
    </section>

    <section id="packing" class="panel">
      <div class="card"><h2>包裝部</h2><div class="helper">急單置頂。單個品項完成就 ☑️；未完成訂單隔天會繼續顯示。可用「包裝回覆」回報進度，例如：已檢30件，待20件。</div><div id="packingOrders"></div></div>
    </section>

    <section id="wall" class="panel">
      <div class="card"><h2>欣儒農產行｜包裝即時看板</h2><div class="helper">完成訂單會自動離開電視牆</div>
        <div id="wallDateBar" class="wallDateBar"></div><div id="wallCards" class="wallCards"></div>
      </div>
    </section>

    <section id="today" class="panel">
<h2>訂單查詢</h2>
<div class="helper">可查詢今天、未來預定單與歷史訂單。</div>
<div class="actions" style="margin:12px 0">
  <input id="queryDate" class="input" type="date" style="max-width:220px">
  <button id="queryDateBtn" class="btn primary">查詢訂單</button>
</div><div id="todayBody"></div>
    </section>
  </div>
</div>


<div id="editModal" class="editModal">
  <div class="editBox">
    <h2>修改訂單</h2>
    <input id="editOrderId" type="hidden">
    <div class="field"><label class="label">客戶／店家名稱</label><input id="editCustomer" class="input"></div>
    <div class="grid2">
      <div class="field"><label class="label">取貨時間</label><input id="editPickupTime" class="input" type="time"></div>
      <div class="field"><label class="label">訂單日期</label><input id="editOrderDate" class="input" type="date"></div>
    </div>
    <div class="field"><label class="label">需求內容（每行一項）</label><textarea id="editItems" class="textarea"></textarea></div>
    <div class="field"><label class="label">備註</label><input id="editNote" class="input"></div>
    <div class="urgentRow"><div><b>🚨 急單</b></div><div id="editUrgentSwitch" class="switch"></div></div>
    <div class="actions"><button id="cancelEdit" class="btn gray">取消</button><button id="saveEdit" class="btn primary" style="flex:1">儲存修改</button></div>
  </div>
</div>

  return py;

  if(!window.pinyinPro?.pinyin)return s;
  return String(s).replace(/[\u3400-\u9FFF]+/g,segment=>{
    try{
      const pys=window.pinyinPro.pinyin(segment,{toneType:'none',type:'array'});
      return pys.map(pinyinToThaiSyllable).join(' ');
    }catch(e){return segment}
  });
}
function translitLine(line){
  let out=String(line??'');
  // 先套用人工修正字典，之後有錯只要補 MAP 即可永久修正
  const placeholders=[];
  Object.keys(MAP).sort((a,b)=>b.length-a.length).forEach((k,idx)=>{
    if(out.includes(k)){
      const token=`__TH${idx}__`;
      placeholders.push([token,MAP[k]]);
      out=out.replaceAll(k,token);
    }
  });
  // 剩下沒有建過的中文，自動產生泰文字音譯
  out=autoChineseToThai(out);
  placeholders.forEach(([token,val])=>{out=out.replaceAll(token,val)});
  return out;
}
function thaiForItem(x){
  const saved=String(x?.thai_phonetic||'').trim();
  if(saved && saved!=='（尚未建立音譯）')return saved;
  return translitLine(x?.item_name||'');
}

function statusBadge(s){return s==='waiting'?'<span class="badge yellow">待接單</span>':s==='packing'?'<span class="badge green">包裝中</span>':'<span class="badge gray">已完成</span>'}
function makeOrderNo(){const d=new Date();const y=String(d.getFullYear()).slice(2),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'),h=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0'),s=String(d.getSeconds()).padStart(2,'0'),r=Math.floor(Math.random()*90+10);return `${y}${m}${day}-${h}${mi}${s}${r}`}
function normalized(row){return {...row,items:(row.order_items||[]).sort((a,b)=>a.id-b.id)}}
async function loadOrders(){
  const {data,error}=await sb.from('orders').select('*, order_items(*)').order('is_urgent',{ascending:false}).order('created_at',{ascending:true});

  orders=(data||[]).map(normalized);$('#syncState').textContent='● 已連線｜即時同步中';renderAll();
}
function renderAll(){renderStall();renderPacking();renderWall();renderToday()}
function renderStall(){const box=$('#stallOrders');const arr=[...orders].filter(o=>o.status!=='done').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));box.innerHTML=arr.length?arr.map(o=>`<div class="order ${o.is_urgent?'urgent':''}"><div class="orderHead"><div><div style="font-size:22px;font-weight:900">${esc(o.customer)} ${o.is_urgent?'<span class="badge red">🚨 急單</span>':''}</div><div class="meta">${esc(o.order_no)}｜取貨 ${esc(o.pickup_time||'')}｜${fmt(o.created_at)}</div></div>${statusBadge(o.status)}</div>${o.items.map(x=>`<div class="item"><div></div><div><div class="cn">${esc(x.item_name)}</div><div class="th">${esc(thaiForItem(x))}</div></div><div>${x.is_completed?'✅':''}</div></div>`).join('')}${o.packing_reply?`<div class="urgentRow" style="margin-top:12px;background:#eef7ff;border-color:#cfe7ff"><div><b>📣 包裝回覆：</b>${esc(o.packing_reply)}</div></div>`:''}<div class="actions" style="margin-top:12px">${o.status!=='done'?`<button class="btn blue" onclick="openEdit(${o.id})">✏️ 修改訂單</button>`:'<span class="meta">已完成訂單不可修改</span>'}<button class="btn red" onclick="deleteOrder(${o.id})">🗑️ 刪除訂單</button></div></div>`).join(''):'<div class="empty">目前沒有待處理訂單</div>'}
function renderPacking(){const box=$('#packingOrders');const arr=[...orders].filter(o=>o.status!=='done').sort((a,b)=>(Number(b.is_urgent)-Number(a.is_urgent))||(String(a.order_date||'').localeCompare(String(b.order_date||'')))||(new Date(a.created_at)-new Date(b.created_at)));box.innerHTML=arr.length?arr.map(o=>{const done=o.items.filter(x=>x.is_completed).length,total=o.items.length,pct=total?Math.round(done/total*100):0;return `<div class="order ${o.is_urgent?'urgent':''}"><div class="orderHead"><div><div class="orderTitle" style="font-size:24px">${esc(o.customer)} ${o.is_urgent?'<span class="badge red">🚨 急單｜ด่วน</span>':''}</div><div class="th">${esc(translitLine(o.customer))}</div><div class="meta">訂單號 ${esc(o.order_no)}｜取貨日期 ${esc(o.order_date||'')}</div></div>${statusBadge(o.status)}</div>${o.items.map(x=>`<div class="item"><div class="check ${x.is_completed?'done':''}" onclick="toggleItem(${x.id},${x.is_completed?'false':'true'},${o.id})">${x.is_completed?'✓':''}</div><div><div class="cn">${esc(x.item_name)}</div><div class="th">${esc(thaiForItem(x))}</div></div><div></div></div>`).join('')}<div style="margin-top:12px"><div class="meta">完成 ${done}/${total}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div></div>${o.note?`<div class="urgentRow" style="margin-top:12px"><div><b>備註：</b>${esc(o.note)}</div></div>`:''}${o.photo_url?`<div style="margin-top:10px"><a href="${esc(o.photo_url)}" target="_blank"><img class="photoMini" src="${esc(o.photo_url)}"></a></div>`:''}<div class="field" style="margin-top:12px"><label class="label">📣 包裝回覆</label><div class="actions"><input id="reply-${o.id}" class="input" style="flex:1" value="${esc(o.packing_reply||'')}" placeholder=""><button class="btn gray" onclick="savePackingReply(${o.id})">儲存回覆</button></div></div><div class="actions" style="margin-top:12px">${o.status==='waiting'?`<button class="btn blue" onclick="startPacking(${o.id})">接單／開始包裝</button>`:''}<button class="btn primary" ${done!==total?'disabled style="opacity:.45"':''} onclick="finishOrder(${o.id})">✅ 整單完成</button></div></div>`}).join(''):'<div class="empty">目前沒有待處理訂單</div>'}

let wallDateFilter='all';
function wallDateLabel(d){
  if(!d)return '';
  const x=String(d).split('-');
  return x.length===3?`${Number(x[1])}/${Number(x[2])}`:d;
}
function renderWallDateBar(activeOrders){
  const bar=$('#wallDateBar'); if(!bar)return;
  const dates=[...new Set(activeOrders.map(o=>o.order_date).filter(Boolean))].sort();
  const opts=[['all','全部'],...dates.map(d=>[d,wallDateLabel(d)])];
  bar.innerHTML=opts.map(([v,l])=>`<button class="wallDateBtn ${wallDateFilter===v?'active':''}" data-wall-date="${esc(v)}">${esc(l)}</button>`).join('');
  bar.querySelectorAll('[data-wall-date]').forEach(btn=>btn.onclick=()=>{wallDateFilter=btn.dataset.wallDate;renderWall()});
}
function renderWall(){
 const allActive=[...orders].filter(o=>o.status!=='done').sort((a,b)=>{
  if(Number(b.is_urgent)!==Number(a.is_urgent))return Number(b.is_urgent)-Number(a.is_urgent);
  const da=String(a.order_date||''),db=String(b.order_date||'');if(da!==db)return da.localeCompare(db);
  return new Date(a.created_at)-new Date(b.created_at);
 });
 renderWallDateBar(allActive);
 const active=wallDateFilter==='all'?allActive:allActive.filter(o=>String(o.order_date||'')===wallDateFilter);
 const box=$('#wallCards');if(!box)return;
 box.innerHTML=active.length?active.map(o=>{
  const done=o.items.filter(x=>x.is_completed).length,total=o.items.length,pct=total?Math.round(done/total*100):0;
  const cth=translitLine(o.customer);
  return `<article class="wallOrderCard ${o.is_urgent?'urgent':''}">
   <div class="wallCardHead"><div><div class="wallCardCustomer">${o.is_urgent?'🚨 ':''}${esc(o.customer)}</div>
   <div class="wallCardThai">${esc(cth)}</div>
   <div class="wallCardDate">取貨日期 ${esc(o.order_date||'')}${o.pickup_time?`｜取貨時間 ${esc(o.pickup_time)}`:''}</div></div>${statusBadge(o.status)}</div>
   <div class="wallCardItems">${o.items.map(x=>`<div class="wallCardItem">${x.is_completed?'✅':'☐'} ${esc(x.item_name)}<div class="th">${esc(thaiForItem(x))}</div></div>`).join('')}</div>
   ${o.packing_reply?`<div class="urgentRow" style="margin-top:12px;background:#eef7ff;border-color:#cfe7ff"><div><b>📣 包裝回覆：</b>${esc(o.packing_reply)}</div></div>`:''}
   <div class="wallCardFoot"><div style="flex:1"><b>進度 ${done}/${total}</b><div class="progress" style="margin-top:7px"><div class="bar" style="width:${pct}%"></div></div></div>
   <div class="wallCardTime">下單 ${fmtDateTime(o.created_at)}</div></div>
  </article>`;
 }).join(''):'<div class="empty">目前沒有待處理訂單</div>';
}
function renderToday(){const b=$('#todayBody');const q=$('#queryDate')?.value||new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});const arr=[...orders].filter(o=>(o.order_date||new Date(o.created_at).toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'}))===q).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));b.innerHTML=arr.length?`<div class="helper" style="margin:10px 0">📅 ${q}｜共 ${arr.length} 張訂單</div><table class="table"><thead><tr><th>下單時間</th><th>客戶</th><th>取貨時間</th><th>品項</th><th>進度</th><th>狀態</th></tr></thead><tbody>${arr.map(o=>{const done=o.items.filter(x=>x.is_completed).length,total=o.items.length;return `<tr><td>${fmtDateTime(o.created_at)}</td><td><b>${o.is_urgent?'🚨 ':''}${esc(o.customer)}</b></td><td>${esc(o.pickup_time||'')}</td><td>${o.items.map(x=>`<div>${esc(x.item_name)}</div><div class="th">${esc(thaiForItem(x))}</div>`).join('')}${o.packing_reply?`<div class="th" style="margin-top:6px">📣 ${esc(o.packing_reply)}</div>`:''}</td><td>${done}/${total}</td><td>${statusBadge(o.status)}${o.completed_at?`<div class="meta">完成 ${fmtDateTime(o.completed_at)}</div>`:''}</td></tr>`}).join('')}</tbody></table>`:`<div class="empty">📅 ${q} 沒有訂單</div>`}
window.toggleItem=async(itemId,newVal,orderId)=>{await sb.from('order_items').update({is_completed:newVal,completed_at:newVal?new Date().toISOString():null}).eq('id',itemId);const o=orders.find(x=>x.id===orderId);if(o&&o.status==='waiting')await sb.from('orders').update({status:'packing'}).eq('id',orderId);await loadOrders()};
window.savePackingReply=async id=>{const el=$(`#reply-${id}`);if(!el)return;const reply=el.value.trim();const {error}=await sb.from('orders').update({packing_reply:reply||null}).eq('id',id);if(error){alert('回覆儲存失敗：'+error.message);return}await loadOrders();};
window.startPacking=async id=>{await sb.from('orders').update({status:'packing'}).eq('id',id);await loadOrders()};
window.finishOrder=async id=>{const o=orders.find(x=>x.id===id);if(!o||!o.items.every(x=>x.is_completed))return;await sb.from('orders').update({status:'done',completed_at:new Date().toISOString()}).eq('id',id);await loadOrders()};
window.deleteOrder=async id=>{const o=orders.find(x=>x.id===id);if(!o)return;const ok=confirm(`確定要刪除「${o.customer}」的訂單嗎？\n訂單編號：${o.order_no}\n\n刪除後無法復原。`);if(!ok)return;try{const {error}=await sb.from('orders').delete().eq('id',id);if(error)throw error;await loadOrders();alert('訂單已刪除');}catch(e){console.error(e);alert('刪除失敗：'+e.message)}};
window.openEdit=id=>{const o=orders.find(x=>x.id===id);if(!o||o.status==='done')return;$('#editOrderId').value=o.id;$('#editCustomer').value=o.customer||'';$('#editPickupTime').value=o.pickup_time||'';$('#editOrderDate').value=o.order_date||taipeiDate();$('#editItems').value=o.items.map(x=>x.item_name).join('\n');$('#editNote').value=o.note||'';editUrgent=!!o.is_urgent;$('#editUrgentSwitch').classList.toggle('on',editUrgent);$('#editModal').classList.add('show')};
$('#editUrgentSwitch').onclick=()=>{editUrgent=!editUrgent;$('#editUrgentSwitch').classList.toggle('on',editUrgent)};
$('#cancelEdit').onclick=()=>$('#editModal').classList.remove('show');
$('#saveEdit').onclick=async()=>{const id=Number($('#editOrderId').value),customer=$('#editCustomer').value.trim(),lines=$('#editItems').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!customer){alert('請輸入客戶／店家名稱');return}if(!lines.length){alert('請輸入需求內容');return}const btn=$('#saveEdit');btn.disabled=true;btn.textContent='儲存中…';try{const {error}=await sb.from('orders').update({customer,pickup_time:$('#editPickupTime').value||null,order_date:$('#editOrderDate').value,note:$('#editNote').value.trim()||null,is_urgent:editUrgent}).eq('id',id);if(error)throw error;const {error:delErr}=await sb.from('order_items').delete().eq('order_id',id);if(delErr)throw delErr;const items=lines.map(text=>({order_id:id,item_name:text,quantity:null,thai_phonetic:translitLine(text),is_completed:false}));const {error:itemErr}=await sb.from('order_items').insert(items);if(itemErr)throw itemErr;$('#editModal').classList.remove('show');await loadOrders();alert('訂單已修改');}catch(e){console.error(e);alert('修改失敗：'+e.message)}finally{btn.disabled=false;btn.textContent='儲存修改'}};
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('#'+t.dataset.tab).classList.add('active');renderAll()});
$('#pickupTime').addEventListener('input',e=>{let v=e.target.value.replace(/[^0-9:]/g,'');if(/^\d{4}$/.test(v))v=v.slice(0,2)+':'+v.slice(2);e.target.value=v.slice(0,5)});
$('#urgentSwitch').onclick=()=>{urgent=!urgent;$('#urgentSwitch').classList.toggle('on',urgent)};
$('#takePhoto').onclick=()=>$('#photoInput').click();
$('#clearPhoto').onclick=()=>{photoFile=null;$('#photoInput').value='';$('#photoPreview').style.display='none';$('#photoPreview').src=''};
$('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;photoFile=f;const r=new FileReader();r.onload=()=>{$('#photoPreview').src=r.result;$('#photoPreview').style.display='block'};r.readAsDataURL(f)};
$('#ocrPhoto').onclick=async()=>{if(!photoFile){alert('請先拍照或選照片');return}const btn=$('#ocrPhoto');btn.disabled=true;btn.textContent='辨識中…';$('#ocrStatus').textContent='正在辨識照片文字，第一次使用可能需要較久…';try{const result=await Tesseract.recognize(photoFile,'chi_tra+eng',{logger:m=>{if(m.status==='recognizing text')$('#ocrStatus').textContent=`辨識中 ${Math.round((m.progress||0)*100)}%`}});const text=(result.data.text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).join('\n');if(text){$('#items').value=text;$('#ocrStatus').textContent='辨識完成，請檢查內容與數量後再送出。'}else{$('#ocrStatus').textContent='沒有辨識到文字，請換清楚一點的照片或手動輸入。'}}catch(e){console.error(e);$('#ocrStatus').textContent='辨識失敗：'+e.message}finally{btn.disabled=false;btn.textContent='辨識照片文字'}};
async function uploadPhoto(orderNo){if(!photoFile)return null;try{const ext=(photoFile.name.split('.').pop()||'jpg').toLowerCase();const path=`${orderNo}-${Date.now()}.${ext}`;const {error}=await sb.storage.from('order-photos').upload(path,photoFile,{upsert:false});if(error)throw error;const {data}=sb.storage.from('order-photos').getPublicUrl(path);return data.publicUrl}catch(e){console.warn('照片尚未上傳：',e.message);return null}}
$('#submitOrder').onclick=async()=>{const customer=$('#customer').value.trim(),pickup=$('#pickupTime').value.trim();if(pickup&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(pickup)){alert('取貨時間請輸入24小時制，例如 08:30、18:45');return}const lines=$('#items').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!customer){alert('請先輸入客戶／店家名稱');return}if(!lines.length){alert('請先輸入需求內容');return}const btn=$('#submitOrder');btn.disabled=true;btn.textContent='送出中…';try{const orderNo=makeOrderNo();const photoUrl=await uploadPhoto(orderNo);const {data:order,error}=await sb.from('orders').insert({order_no:orderNo,customer,pickup_time:pickup||null,note:$('#note').value.trim()||null,photo_url:photoUrl,is_urgent:urgent,order_date:$('#orderDate').value,status:'waiting'}).select().single();if(error)throw error;const items=lines.map(text=>({order_id:order.id,item_name:text,quantity:null,thai_phonetic:translitLine(text),is_completed:false}));const {error:itemErr}=await sb.from('order_items').insert(items);if(itemErr)throw itemErr;$('#items').value='';$('#note').value='';$('#orderDate').value=taipeiDate();urgent=false;$('#urgentSwitch').classList.remove('on');$('#clearPhoto').click();await loadOrders();alert('訂單已送出');}catch(e){console.error(e);alert('送出失敗：'+e.message)}finally{btn.disabled=false;btn.textContent='送出訂單'}};
$('#transBtn').onclick=()=>{const v=$('#transInput').value.trim();$('#transResult').textContent=v?`${v} → ${translitLine(v)}`:''};
function unlockAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function playOrderSound(isUrgent=false){
 try{
  unlockAudio();const now=audioCtx.currentTime,total=3.0,step=.25,count=Math.floor(total/step);
  for(let i=0;i<count;i++){const t=now+i*step,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
   osc.type='square';osc.frequency.value=isUrgent?(i%2?1050:760):(i%2?920:680);
   gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(isUrgent?.24:.18,t+.02);gain.gain.exponentialRampToValueAtTime(.0001,t+.20);
   osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.22);}
  if(document.hidden&&'Notification'in window&&Notification.permission==='granted'){
   try{new Notification(isUrgent?'🚨 欣儒急單':'🔔 欣儒新訂單',{body:'有新的訂單進來，請查看包裝系統。'});}catch(e){}
  }
 }catch(e){console.warn('提示音無法播放',e)}
}
document.addEventListener('pointerdown',()=>{unlockAudio();if('Notification'in window&&Notification.permission==='default'){Notification.requestPermission().catch(()=>{});}},{once:true});
const channel=sb.channel('xinru-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},payload=>{playOrderSound(!!payload.new?.is_urgent);loadOrders()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders'},()=>loadOrders()).on('postgres_changes',{event:'DELETE',schema:'public',table:'orders'},()=>loadOrders()).on('postgres_changes',{event:'*',schema:'public',table:'order_items'},()=>loadOrders()).subscribe(status=>{$('#syncState').textContent=status==='SUBSCRIBED'?'● 已連線｜即時同步中':'正在連線 Supabase…'});
$('#queryDateBtn').onclick=()=>renderToday();
$('#queryDate').onchange=()=>renderToday();
  loadOrders();
const AUTO_REFRESH_MS=10000;
setInterval(()=>{if(document.visibilityState==='visible')loadOrders();},AUTO_REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadOrders();});
